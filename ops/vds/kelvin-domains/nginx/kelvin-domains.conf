# Kelvin Jiménez — personal/songs lane (NOT nica.futbol team site)
# Install: ops/vds/kelvin-domains/apply_on_vds.sh

server {
    listen 80;
    listen [::]:80;
    server_name kelvinjimenez.com www.kelvinjimenez.com;
    root /root/sites/kelvinjimenez.com;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name kelinsongs.com www.kelinsongs.com;
    root /root/sites/kelinsongs.com;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
}
